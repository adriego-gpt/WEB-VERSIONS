<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prueba local del cierre de pedido</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React, { useState } from "react";
      import { createRoot } from "react-dom/client";
      import "/src/index.css";
      import "/src/App.css";
      import { OrderSuccessRedirectModal } from "/src/components/modals/OrderSuccessRedirectModal.jsx";
      import {
        createOrderSuccessModalState,
        createEmptyPendingWhatsAppConfirmation,
        normalizePendingWhatsAppConfirmation,
        markPendingWhatsAppAsOpened,
      } from "/src/domain/orders/pendingWhatsAppConfirmation.js";

      const paymentMethod = new URLSearchParams(location.search).get("method") === "card_link" ? "card_link" : "transfer";
      const fixtureKey = `adriego-test-order-success-${paymentMethod}`;
      const newState = () => createOrderSuccessModalState({
        order: { id: "local-preview-only", code: "ADR-PRUEBA-12345", total: 125.50, paymentMethod },
        whatsappUrl: "https://wa.me/593999999999?text=Prueba%20local",
      });
      function Preview() {
        const [state, setState] = useState(() => {
          const stored = JSON.parse(localStorage.getItem(fixtureKey) || "null");
          if (stored?.dismissed) return createEmptyPendingWhatsAppConfirmation();
          const initial = normalizePendingWhatsAppConfirmation(stored) || newState();
          if (paymentMethod === "card_link") localStorage.setItem(fixtureKey, JSON.stringify(initial));
          return initial;
        });
        const dismiss = () => { localStorage.setItem(fixtureKey, JSON.stringify({ dismissed: true })); setState(createEmptyPendingWhatsAppConfirmation()); };
        const show = () => {
          const fresh = newState();
          localStorage.setItem(fixtureKey, JSON.stringify(fresh));
          setState(fresh);
        };
        return React.createElement(React.Fragment, null,
          React.createElement("main", { style: { padding: 32 } },
            React.createElement("h1", null, "Prueba local: no se crean pedidos ni se envían mensajes"),
            React.createElement("button", { className: "btn btn-primary", onClick: show }, "Volver a mostrar el pedido"),
            !state.open && React.createElement("p", { role: "status" }, "Historial de pedidos de prueba")),
          state.open && React.createElement(OrderSuccessRedirectModal, {
            ...state, isMobile: false, onDismiss: dismiss, onConfirmSent: dismiss,
            onWhatsAppOpened: () => {
              const pending = markPendingWhatsAppAsOpened(state);
              if (pending) { localStorage.setItem(fixtureKey, JSON.stringify(pending)); setState(pending); }
            },
            onLaunchWhatsApp: () => {},
          }));
      }
      createRoot(document.getElementById("root")).render(React.createElement(Preview));
    </script>
  </body>
</html>
